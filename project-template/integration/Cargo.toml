[package]
name = "integration"
version = "0.1.0"
edition.workspace = true

[dependencies]
miden-client = { version = "0.17.2", features = ["tonic", "testing"] }
blake3 = "1"
miden-client-sqlite-store = "0.17.2"
miden-standards = { version = "0.17.1", features = ["testing"] }
miden-testing = "0.17.1"
miden-protocol = { version = "0.17.1", features = ["testing"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "macros", "fs", "time"] }
rand = "0.10"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
